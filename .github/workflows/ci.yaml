name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck, shfmt, hadolint e actionlint
        run: make lint

  test:
    name: Integração (dind + sshd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build e teste
        run: make test
