name: Release

# Tag vX.Y.Z → testa, publica ghcr.io/<repo>:vX.Y.Z e :vX, move a tag git vX e cria a release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publicar ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: action.yaml aponta para esta versão
        run: |
          grep -qE "image: docker://${IMAGE}:${VERSION}\$" action.yaml || {
            echo "::error::action.yaml não aponta para ${IMAGE}:${VERSION}; rode 'make release-prep VERSION=${VERSION}'"
            exit 1
          }

      - name: Lint e teste
        run: make lint test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag major
        id: major
        run: echo "tag=${VERSION%%.*}" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ steps.major.outputs.tag }}

      # Só depois da imagem publicada: quem usa @vX passa a pegar esta versão.
      - name: Mover a tag ${{ steps.major.outputs.tag }}
        env:
          MAJOR: ${{ steps.major.outputs.tag }}
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/${MAJOR}"

      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
