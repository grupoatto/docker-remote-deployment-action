name: Docker Remote Deployment
description: Deploy em um Docker ou Swarm remoto por SSH (script, docker stack deploy ou docker compose).
author: Grupo ATTO

inputs:
  remote_docker_host:
    description: Usuário e host do Docker remoto (ex. docker@172.16.0.63).
    required: true
  remote_docker_port:
    description: Porta SSH do host remoto.
    required: false
    default: "22"
  ssh_private_key:
    description: Chave privada SSH (conteúdo) com acesso ao Docker do host.
    required: true
  ssh_known_hosts:
    description: >-
      Linhas do known_hosts do servidor (saída conferida de `ssh-keyscan -p <porta> <host>`).
      Recomendado; sem ele a chave do host é aceita na primeira conexão, com aviso.
    required: false
    default: ""
  ssh_public_key:
    description: Obsoleto e ignorado (mantido para não quebrar workflows da v5).
    required: false
    default: ""
  deployment_mode:
    description: "script (padrão) | swarm | compose."
    required: false
    default: script
  docker_script:
    description: Script bash executado no modo script, com DOCKER_HOST já apontando para o host.
    required: false
    default: ""
  stack_file_name:
    description: Arquivo(s) de stack/compose dos modos swarm e compose, separados por espaço.
    required: false
    default: docker-compose.yaml
  stack_name:
    description: Nome da stack (obrigatório no modo swarm; project name no modo compose).
    required: false
    default: ""
  working_directory:
    description: Diretório, relativo ao workspace, onde o deploy roda.
    required: false
    default: "."
  docker_registry_uri:
    description: Registry do docker login (ex. ghcr.io). Vazio = Docker Hub.
    required: false
    default: ""
  docker_registry_username:
    description: Usuário do registry. O login só acontece com usuário e token preenchidos.
    required: false
    default: ""
  docker_registry_token:
    description: Token do registry.
    required: false
    default: ""
  docker_api_version:
    description: Força a versão da API do Docker (ex. 1.44). Vazio = negociada com o daemon.
    required: false
    default: ""
  debug:
    description: "true imprime o script completo e liga o log detalhado do SSH."
    required: false
    default: "false"

outputs:
  docker_server_version:
    description: Versão do Docker do host remoto.

runs:
  using: docker
  # Imagem pronta, publicada pelo release.yaml; a tag acompanha a versão desta action.
  image: docker://ghcr.io/grupoatto/docker-remote-deployment-action:v6.0.0

branding:
  icon: send
  color: green
